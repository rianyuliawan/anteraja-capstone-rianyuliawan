<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="1320" viewBox="0 0 2050 1320" role="img" aria-labelledby="title desc">
  <title id="title">ERD Anteraja Frozen Cold Chain Tracking</title>
  <desc id="desc">Sembilan tabel produksi PostgreSQL beserta primary key, foreign key, dan relasinya.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-label { fill: #334155; font: 600 16px Arial, sans-serif; paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .header { fill: #ed0677; }
      .entity { fill: #ffffff; font: 700 19px Arial, sans-serif; letter-spacing: .4px; }
      .field { fill: #1e293b; font: 15px Arial, sans-serif; }
      .key { fill: #be0a61; font: 700 14px Arial, sans-serif; }
      .type { fill: #64748b; font: 13px Arial, sans-serif; }
      .rule { stroke: #e2e8f0; stroke-width: 1; }
      .title { fill: #0f172a; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 17px Arial, sans-serif; }
      .legend-title { fill: #0f172a; font: 700 16px Arial, sans-serif; }
      .legend { fill: #475569; font: 14px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="page" width="2050" height="1320"/>
  <text class="title" x="50" y="52">ERD Anteraja Frozen — Cold Chain Tracking</text>
  <text class="subtitle" x="50" y="82">PostgreSQL • tabel produksi ternormalisasi • suhu melekat pada aset termal</text>

  <!-- Relationships are drawn before cards so their lines stay behind the entities. -->
  <path class="edge" d="M 430 245 C 470 245, 480 245, 520 245"/>
  <text class="edge-label" x="455" y="230">1 : N</text>

  <path class="edge" d="M 430 620 C 485 620, 460 365, 520 365"/>
  <text class="edge-label" x="450" y="500">0..1 : N</text>

  <path class="edge" d="M 430 335 C 470 335, 470 585, 520 585"/>
  <text class="edge-label" x="448" y="470">1 : N</text>

  <path class="edge" d="M 430 695 C 470 695, 475 695, 520 695"/>
  <text class="edge-label" x="448" y="680">0..1 : N</text>

  <path class="edge" d="M 430 1065 C 470 1065, 475 1065, 520 1065"/>
  <text class="edge-label" x="448" y="1050">1 : N</text>

  <path class="edge" d="M 430 185 C 760 115, 900 145, 1020 255"/>
  <text class="edge-label" x="770" y="133">1 : N</text>

  <path class="edge" d="M 900 1035 C 970 1035, 930 480, 1020 480"/>
  <text class="edge-label" x="940" y="770">1 : N</text>

  <path class="edge" d="M 900 1115 C 970 1115, 960 1010, 1020 1010"/>
  <text class="edge-label" x="940" y="1080">1 : N</text>

  <path class="edge" d="M 900 700 C 1160 700, 1340 360, 1580 360"/>
  <text class="edge-label" x="1240" y="535">1 : 0..N</text>

  <!-- SHIPMENTS -->
  <g transform="translate(50 130)">
    <rect class="card" width="380" height="330" rx="18"/>
    <path class="header" d="M18 0 H362 Q380 0 380 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">SHIPMENTS</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="270" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="360" y2="105"/>
    <text class="key" x="22" y="133">UK</text><text class="field" x="62" y="133">awb</text><text class="type" x="270" y="133">varchar(50)</text>
    <text class="field" x="22" y="169">pickup_area</text><text class="type" x="270" y="169">varchar</text>
    <text class="field" x="22" y="205">pickup_point</text><text class="type" x="270" y="205">varchar</text>
    <text class="field" x="22" y="241">delivery_area</text><text class="type" x="270" y="241">varchar</text>
    <text class="field" x="22" y="277">delivery_point</text><text class="type" x="270" y="277">varchar</text>
    <text class="field" x="22" y="313">created_at / updated_at</text><text class="type" x="270" y="313">timestamptz</text>
  </g>

  <!-- ROUTE_STOPS -->
  <g transform="translate(520 105)">
    <rect class="card" width="380" height="365" rx="18"/>
    <path class="header" d="M18 0 H362 Q380 0 380 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">ROUTE_STOPS</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="270" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="360" y2="105"/>
    <text class="key" x="22" y="133">FK</text><text class="field" x="62" y="133">shipment_id</text><text class="type" x="270" y="133">bigint</text>
    <text class="key" x="22" y="169">FK</text><text class="field" x="62" y="169">hub_id</text><text class="type" x="270" y="169">bigint?</text>
    <text class="field" x="22" y="205">stop_order</text><text class="type" x="270" y="205">smallint</text>
    <text class="field" x="22" y="241">point_type</text><text class="type" x="270" y="241">varchar(20)</text>
    <text class="field" x="22" y="277">display_name</text><text class="type" x="270" y="277">varchar</text>
    <text class="field" x="22" y="313">latitude / longitude</text><text class="type" x="270" y="313">numeric</text>
    <text class="key" x="22" y="349">UK</text><text class="field" x="62" y="349">shipment_id + stop_order</text>
  </g>

  <!-- HUBS -->
  <g transform="translate(50 535)">
    <rect class="card" width="380" height="285" rx="18"/>
    <path class="header" d="M18 0 H362 Q380 0 380 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">HUBS</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="270" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="360" y2="105"/>
    <text class="key" x="22" y="133">UK</text><text class="field" x="62" y="133">code</text><text class="type" x="270" y="133">varchar(30)</text>
    <text class="field" x="22" y="169">name</text><text class="type" x="270" y="169">varchar</text>
    <text class="field" x="22" y="205">area</text><text class="type" x="270" y="205">varchar</text>
    <text class="field" x="22" y="241">latitude / longitude</text><text class="type" x="270" y="241">numeric</text>
    <text class="field" x="22" y="271">updated_at</text><text class="type" x="270" y="271">timestamptz</text>
  </g>

  <!-- SHIPMENT_EVENTS -->
  <g transform="translate(520 510)">
    <rect class="card" width="380" height="370" rx="18"/>
    <path class="header" d="M18 0 H362 Q380 0 380 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">SHIPMENT_EVENTS</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="270" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="360" y2="105"/>
    <text class="key" x="22" y="133">FK</text><text class="field" x="62" y="133">shipment_id</text><text class="type" x="270" y="133">bigint</text>
    <text class="key" x="22" y="169">FK</text><text class="field" x="62" y="169">hub_id</text><text class="type" x="270" y="169">bigint?</text>
    <text class="field" x="22" y="205">stage</text><text class="type" x="270" y="205">varchar(30)</text>
    <text class="field" x="22" y="241">event_code</text><text class="type" x="270" y="241">varchar(30)</text>
    <text class="field" x="22" y="277">occurred_at</text><text class="type" x="270" y="277">timestamptz</text>
    <text class="field" x="22" y="313">completed_stop_order</text><text class="type" x="270" y="313">smallint?</text>
    <text class="field" x="22" y="349">source_event_key</text><text class="type" x="270" y="349">varchar?</text>
  </g>

  <!-- TEMPERATURE_PROFILES -->
  <g transform="translate(50 940)">
    <rect class="card" width="380" height="320" rx="18"/>
    <path class="header" d="M18 0 H362 Q380 0 380 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">TEMPERATURE_PROFILES</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">asset_type</text><text class="type" x="270" y="88">varchar(30)</text>
    <line class="rule" x1="20" y1="105" x2="360" y2="105"/>
    <text class="field" x="22" y="139">target_c</text><text class="type" x="270" y="139">numeric(5,2)</text>
    <text class="field" x="22" y="175">normal_low_c</text><text class="type" x="270" y="175">numeric(5,2)</text>
    <text class="field" x="22" y="211">normal_high_c</text><text class="type" x="270" y="211">numeric(5,2)</text>
    <text class="field" x="22" y="247">warning_low_c</text><text class="type" x="270" y="247">numeric(5,2)</text>
    <text class="field" x="22" y="283">warning_high_c</text><text class="type" x="270" y="283">numeric(5,2)</text>
  </g>

  <!-- THERMAL_ASSETS -->
  <g transform="translate(520 940)">
    <rect class="card" width="380" height="285" rx="18"/>
    <path class="header" d="M18 0 H362 Q380 0 380 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">THERMAL_ASSETS</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="270" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="360" y2="105"/>
    <text class="key" x="22" y="133">UK</text><text class="field" x="62" y="133">asset_code</text><text class="type" x="270" y="133">varchar(50)</text>
    <text class="key" x="22" y="169">FK</text><text class="field" x="62" y="169">asset_type</text><text class="type" x="270" y="169">varchar(30)</text>
    <text class="field" x="22" y="205">display_name</text><text class="type" x="270" y="205">varchar</text>
    <text class="field" x="22" y="241">is_active</text><text class="type" x="270" y="241">boolean</text>
  </g>

  <!-- SHIPMENT_ASSET_ASSIGNMENTS -->
  <g transform="translate(1020 145)">
    <rect class="card" width="525" height="430" rx="18"/>
    <path class="header" d="M18 0 H507 Q525 0 525 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">SHIPMENT_ASSET_ASSIGNMENTS</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="405" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="505" y2="105"/>
    <text class="key" x="22" y="137">FK</text><text class="field" x="62" y="137">shipment_id</text><text class="type" x="405" y="137">bigint</text>
    <text class="key" x="22" y="173">FK</text><text class="field" x="62" y="173">thermal_asset_id</text><text class="type" x="405" y="173">bigint</text>
    <text class="field" x="22" y="209">segment</text><text class="type" x="405" y="209">varchar(30)</text>
    <text class="field" x="22" y="245">started_at</text><text class="type" x="405" y="245">timestamptz</text>
    <text class="field" x="22" y="281">ended_at</text><text class="type" x="405" y="281">timestamptz?</text>
    <text class="field" x="22" y="317">active_period</text><text class="type" x="405" y="317">tstzrange</text>
    <line class="rule" x1="20" y1="338" x2="505" y2="338"/>
    <text class="key" x="22" y="369">RULE</text><text class="field" x="84" y="369">periode satu AWB tidak boleh overlap</text>
    <text class="key" x="22" y="405">UK</text><text class="field" x="62" y="405">maksimal satu assignment aktif per shipment</text>
  </g>

  <!-- TEMPERATURE_READINGS -->
  <g transform="translate(1020 730)">
    <rect class="card" width="525" height="465" rx="18"/>
    <path class="header" d="M18 0 H507 Q525 0 525 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">TEMPERATURE_READINGS</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="405" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="505" y2="105"/>
    <text class="key" x="22" y="137">FK</text><text class="field" x="62" y="137">thermal_asset_id</text><text class="type" x="405" y="137">bigint</text>
    <text class="field" x="22" y="173">source</text><text class="type" x="405" y="173">varchar(30)</text>
    <text class="field" x="22" y="209">message_id</text><text class="type" x="405" y="209">varchar(120)</text>
    <text class="field" x="22" y="245">request_id</text><text class="type" x="405" y="245">uuid?</text>
    <text class="field" x="22" y="281">trigger_type</text><text class="type" x="405" y="281">varchar(20)</text>
    <text class="field" x="22" y="317">observed_at / received_at</text><text class="type" x="405" y="317">timestamptz</text>
    <text class="field" x="22" y="353">temperature_c</text><text class="type" x="405" y="353">numeric(5,2)</text>
    <text class="field" x="22" y="389">temperature_status</text><text class="type" x="405" y="389">varchar(20)?</text>
    <text class="key" x="22" y="429">UK</text><text class="field" x="62" y="429">source + message_id</text>
  </g>

  <!-- SHIPMENT_EVENT_MEDIA -->
  <g transform="translate(1580 140)">
    <rect class="card" width="420" height="500" rx="18"/>
    <path class="header" d="M18 0 H402 Q420 0 420 18 V58 H0 V18 Q0 0 18 0Z"/>
    <text class="entity" x="22" y="37">SHIPMENT_EVENT_MEDIA</text>
    <text class="key" x="22" y="88">PK</text><text class="field" x="62" y="88">id</text><text class="type" x="315" y="88">bigint</text>
    <line class="rule" x1="20" y1="105" x2="400" y2="105"/>
    <text class="key" x="22" y="137">FK</text><text class="field" x="62" y="137">shipment_event_id</text><text class="type" x="315" y="137">bigint</text>
    <text class="field" x="22" y="173">media_type</text><text class="type" x="315" y="173">varchar(30)</text>
    <text class="field" x="22" y="209">storage_disk / storage_key</text><text class="type" x="315" y="209">varchar</text>
    <text class="field" x="22" y="245">mime_type</text><text class="type" x="315" y="245">varchar(50)</text>
    <text class="field" x="22" y="281">file_size_bytes</text><text class="type" x="315" y="281">integer</text>
    <text class="field" x="22" y="317">width_px / height_px</text><text class="type" x="315" y="317">integer</text>
    <text class="field" x="22" y="353">captured_at</text><text class="type" x="315" y="353">timestamptz</text>
    <text class="field" x="22" y="389">privacy_status</text><text class="type" x="315" y="389">varchar(20)</text>
    <text class="field" x="22" y="425">alt_text / checksum_sha256</text><text class="type" x="315" y="425">varchar</text>
    <line class="rule" x1="20" y1="445" x2="400" y2="445"/>
    <text class="key" x="22" y="477">UK</text><text class="field" x="62" y="477">event + media_type; storage key</text>
  </g>

  <g transform="translate(1020 1230)">
    <text class="legend-title" x="0" y="0">Legenda:</text>
    <text class="legend" x="78" y="0">PK = Primary Key</text>
    <text class="legend" x="230" y="0">FK = Foreign Key</text>
    <text class="legend" x="385" y="0">UK = Unique Key</text>
    <text class="legend" x="0" y="28">Tanda ? berarti kolom boleh NULL. Panah menunjuk tabel anak (sisi banyak).</text>
  </g>
</svg>
